<div *ngIf="images.length > 0; else noImages" class="image-list">
    <mat-card *ngFor="let image of images" class="image-card">
      <mat-card-title>{{ image.filename }}</mat-card-title>
      <mat-card-content>
        <img 
          *ngIf="image.image_preview" 
          [src]="'data:image/jpeg;base64,' + image.image_preview" 
          alt="Preview" 
          class="image-preview"
          [style.width.px]="256" 
          [style.height]="'auto'"
        />
        <p>Size: {{ image.width }}x{{ image.height }}</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="primary" [routerLink]="['/image', image._id]">View Details</button>
      </mat-card-actions>
    </mat-card>
  </div>
  
  <!-- Mensaje si no hay imágenes -->
  <ng-template #noImages>
    <p>No images found.</p>
  </ng-template>
